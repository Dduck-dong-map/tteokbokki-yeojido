<div>
<h1 style="margin: 0; font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 46px; line-height: 1">마포구 쌀떡볶이 <span style="color: #C00000">38곳</span></h1>

<a href="Main.dc.html" aria-label="지도에서 크게 보기" style="position: relative; display: block; width: 358px; height: 206px; overflow: hidden; border: 1px solid #8C7B63; box-shadow: 0 0 0 3px #ECE1CF, 0 0 0 4px #B9A88E">
<img src="/_blob/8b2ad793f5588cf1b510682f2c12d02b" alt="" style="position: absolute; left: -16px; top: -250px; width: 390px; height: 844px">
<span style="position: absolute; left: 100px; top: 172px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: #C00000; color: #F6EFE3; font-family: 'Song Myung', serif; font-size: 15px; transform: rotate(-3deg)">3</span>
<span style="position: absolute; left: 132px; top: 8px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: #BC3A12; color: #F6EFE3; font-family: 'Song Myung', serif; font-size: 15px; transform: rotate(2deg)">2</span>
<span style="position: absolute; left: 148px; top: 124px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: #9E0012; color: #F6EFE3; font-family: 'Song Myung', serif; font-size: 15px; transform: rotate(-4deg)">4</span>
<span style="position: absolute; left: 20px; top: 86px; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 2px; background: #A6521B; color: #F6EFE3; font-family: 'Song Myung', serif; font-size: 15px; transform: rotate(3deg)">1</span>
<span style="position: absolute; right: 8px; bottom: 8px; padding: 4px 8px; border-radius: 4px; background: rgba(26, 22, 20, 0.85); color: #F6EFE3; font-size: 12px">지도에서 크게 보기</span>
</a>

<div role="group" aria-label="정렬" style="display: flex; gap: 6px; margin-top: 4px">
<sc-for list="{{sorts}}" as="item" hint-placeholder-count="3">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>

<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 1px solid #D5C6AE">
<sc-for list="{{shops}}" as="item" hint-placeholder-count="7">
<li style="border-bottom: 1px solid #D5C6AE">
<a href="Store.dc.html" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 2px; text-decoration: none; color: #1A1614">
<span style="display: block; width: 36px; height: 36px; padding: 2px; box-sizing: border-box; flex-shrink: 0; border-radius: 3px; background: {{item.color}}; opacity: {{item.opacity}}; transform: rotate({{item.rot}}deg)" aria-hidden="true"><span style="display: flex; align-items: center; justify-content: center; height: 100%; border: 1px solid rgba(246, 239, 227, 0.75); border-radius: 2px; color: #F6EFE3; font-family: 'Song Myung', serif; font-size: 19px">{{item.spicy}}</span></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="display: flex; align-items: center; gap: 6px"><span style="font-size: 16px; font-weight: 700">{{item.name}}</span><span style="font-size: 12px; color: #5C5046">{{item.grade}}</span></span>
<span style="font-size: 14px; color: #3B3029">{{item.desc}}</span>
<span style="font-size: 12px; color: {{item.metaColor}}">{{item.meta}}</span>
</span>
<span style="font-size: 13px; color: #5C5046; flex-shrink: 0; padding-top: 2px">{{item.dist}}</span>
</a>
</li>
</sc-for>
</ol>

<section style="display: flex; flex-direction: column; gap: 10px; margin-top: 6px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">이런 지도도 있어요</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<a href="#" style="display: flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #CDBDA3; background: #FBF7EF; color: #1A1614; font-size: 14px; text-decoration: none">마포구 밀떡볶이</a>
<a href="#" style="display: flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #CDBDA3; background: #FBF7EF; color: #1A1614; font-size: 14px; text-decoration: none">마포구 즉석떡볶이</a>
<a href="#" style="display: flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #CDBDA3; background: #FBF7EF; color: #1A1614; font-size: 14px; text-decoration: none">서대문구 쌀떡볶이</a>
<a href="#" style="display: flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #CDBDA3; background: #FBF7EF; color: #1A1614; font-size: 14px; text-decoration: none">신촌 국물떡볶이</a>
</div>
</section>

</div>

<footer style="margin-top: auto; padding: 22px 16px 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-top: 1px solid #D5C6AE">
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="Report.dc.html" style="font-size: 14px; font-weight: 700">빠진 가게가 있나요? 제보하기</a>
<span style="font-size: 12px; color: #5C5046">노출 순서는 팔지 않아요</span>
</div>
<img src="/_blob/b15e555c7829ccb686f812f32e0af9fa" alt="" style="width: 110px; height: 36px; flex-shrink: 0">
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1480}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sort: '최근 확인순' };
}
renderVals() {
const s = this.state;
const colors = { 1: '#A6521B', 2: '#BC3A12', 3: '#C00000', 4: '#9E0012', 5: '#6E0A0E' };
const shops = [
{ name: '합정 쌀떡집', grade: '떡볶이 전문', style: '국물', price: 4500, days: 3, m: 350, spicy: 3 },
{ name: '망원시장 기름떡볶이', grade: '분식집', style: '기름', price: 4000, days: 5, m: 1100, spicy: 1 },
{ name: '연남 골목 떡볶이', grade: '떡볶이 전문', style: '촉촉', price: 5000, days: 8, m: 900, spicy: 2 },
{ name: '상수 떡볶이', grade: '분식집', style: '즉석', price: 5500, days: 12, m: 700, spicy: 4 },
{ name: '와우산 즉석떡볶이', grade: '떡볶이 전문', style: '즉석', price: 5500, days: 20, m: 450, spicy: 4 },
{ name: '공덕 시장 쌀떡', grade: '분식집', style: '국물', price: 4000, days: 41, m: 2300, spicy: 2 },
{ name: '서강 분식', grade: '분식집', style: '촉촉', price: 3500, days: 214, m: 1400, spicy: 2 }
];
const key = { '최근 확인순': (a, b) => a.days - b.days, '가까운 순': (a, b) => a.m - b.m, '맵기 순': (a, b) => b.spicy - a.spicy || a.days - b.days };
const rots = [-3, 2, -2, 3, -4, 2, -1];
const list = shops.slice().sort(key[s.sort]).map((x, i) => {
const stale = x.days > 180;
return {
name: x.name, grade: x.grade, spicy: x.spicy, color: colors[x.spicy], rot: rots[i],
desc: '쌀떡 · ' + x.style + ' · 1인분 ' + x.price.toLocaleString('ko-KR') + '원',
meta: stale ? x.days + '일 전 확인 · 오래된 정보일 수 있어요' : x.days + '일 전 확인',
metaColor: stale ? '#8E0000' : '#5C5046',
dist: x.m >= 1000 ? (x.m / 1000).toFixed(1) + 'km' : x.m + 'm',
opacity: stale ? 0.55 : 1
};
});
const sorts = ['최근 확인순', '가까운 순', '맵기 순'].map((t) => ({
label: t, pressed: s.sort === t, pick: () => this.setState({ sort: t }),
bg: s.sort === t ? '#1A1614' : '#FBF7EF',
fg: s.sort === t ? '#F6EFE3' : '#1A1614',
bd: s.sort === t ? '#1A1614' : '#CDBDA3'
}));
return { shops: list, sorts: sorts };
}
}
</script>
</body>
