<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>떡볶여지도 취향 필터</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Song+Myung&amp;family=Nanum+Pen+Script&amp;display=swap">
<style>
body{margin:0}
a{color:#C00000}a:hover{color:#8E0000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #ECE3D1; font-family: 'Noto Sans KR', sans-serif; color: #1A1614">

<img src="/_blob/8b2ad793f5588cf1b510682f2c12d02b" alt="" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px">
<a href="Main.dc.html" aria-label="닫고 지도로" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(26, 22, 20, 0.5)"></a>

<section aria-label="취향 필터" style="position: absolute; left: 0; top: 96px; width: 390px; height: 748px; box-sizing: border-box; border-radius: 18px 18px 0 0; background: #F6F0E4; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #CDBDA3"></span></div>

<div style="flex-grow: 1; overflow: hidden; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 34px; line-height: 1.1">오늘은 어떤 떡?</h2>
<button type="button" onClick="{{reset}}" style="height: 44px; padding: 0 4px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #5C5046; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">처음부터</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 6px"><h3 style="margin: 0; font-size: 15px; font-weight: 700">떡</h3><span style="font-size: 12px; color: #5C5046">여러 개 골라도 돼요</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tteoks}}" as="item" hint-placeholder-count="7">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 6px"><h3 style="margin: 0; font-size: 15px; font-weight: 700">스타일</h3><span style="font-size: 12px; color: #5C5046">하나만</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{styles}}" as="item" hint-placeholder-count="8">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 6px"><h3 style="margin: 0; font-size: 15px; font-weight: 700">맵기</h3><span style="font-size: 12px; color: #5C5046">기준 메뉴와 견줘서 매긴 단계예요</span></div>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{spicy}}" as="item" hint-placeholder-count="5">
<button type="button" aria-pressed="{{item.pressed}}" aria-label="{{item.aria}}" onClick="{{item.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; box-sizing: border-box; border-radius: 3px; border: 2px solid {{item.color}}; background: {{item.bg}}; color: {{item.fg}}; font-family: 'Song Myung', serif; font-size: 21px; transform: rotate({{item.rot}}deg)">{{item.n}}</span>
<span style="font-size: 11px; line-height: 1.3; color: #3B3029; text-align: center; white-space: pre-line">{{item.ref}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">1인분 가격</h3>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{prices}}" as="item" hint-placeholder-count="4">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">더 거르기</h3>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{toggles}}" as="item" hint-placeholder-count="3">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 13px; border-radius: 18px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.mark}}{{item.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="padding: 12px 20px 22px; border-top: 1px solid #DDD0BA; background: #F6F0E4">
<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 12px; background: #C00000; color: #F6EFE3; font-size: 16px; font-weight: 700; text-decoration: none">조건에 맞는 가게 {{count}}곳 보기</a>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tteok: ['쌀떡'], style: '국물', spicy: [2, 3], price: '5천 원 이하', toggles: ['영업 중만'] };
}
chip(label, on, pick) {
return {
label: label,
pick: pick,
pressed: on,
bg: on ? '#1A1614' : '#FBF7EF',
fg: on ? '#F6EFE3' : '#1A1614',
bd: on ? '#1A1614' : '#CDBDA3'
};
}
toggleIn(key, value) {
const list = this.state[key];
const next = list.indexOf(value) >= 0 ? list.filter((v) => v !== value) : list.concat([value]);
this.setState({ [key]: next });
}
renderVals() {
const s = this.state;
const tteokShare = { '밀떡': 0.5, '쌀떡': 0.35, '누들밀떡': 0.08, '가래떡': 0.1, '눈사람떡': 0.05, '치즈떡': 0.12, '분모자': 0.06 };
const styleShare = { '국물': 0.3, '촉촉': 0.45, '즉석': 0.12, '기름': 0.05, '로제': 0.1, '짜장': 0.04, '마라': 0.05, '궁중': 0.02 };
const priceShare = { '4천 원 이하': 0.3, '5천 원 이하': 0.65, '6천 원 이하': 0.85, '상관없음': 1 };
const spicyLevels = [
{ n: 1, ref: '안 매움', color: '#A6521B', share: 0.12 },
{ n: 2, ref: '진라면\n매운맛', color: '#BC3A12', share: 0.3 },
{ n: 3, ref: '신라면', color: '#C00000', share: 0.33 },
{ n: 4, ref: '불닭\n볶음면', color: '#9E0012', share: 0.17 },
{ n: 5, ref: '핵불닭\n이상', color: '#6E0A0E', share: 0.08 }
];
const rots = [-3, 2, -2, 3, -4];
const toggleNames = ['영업 중만', '혼밥 가능', '‘메뉴에 있음’ 가게도'];

const tteoks = Object.keys(tteokShare).map((t) => this.chip(t, s.tteok.indexOf(t) >= 0, () => this.toggleIn('tteok', t)));
const styles = Object.keys(styleShare).map((t) => this.chip(t, s.style === t, () => this.setState({ style: s.style === t ? null : t })));
const prices = Object.keys(priceShare).map((t) => this.chip(t, s.price === t, () => this.setState({ price: t })));
const toggles = toggleNames.map((t) => {
const on = s.toggles.indexOf(t) >= 0;
return Object.assign(this.chip(t, on, () => this.toggleIn('toggles', t)), { mark: on ? '✓ ' : '' });
});
const spicy = spicyLevels.map((l, i) => {
const on = s.spicy.indexOf(l.n) >= 0;
return {
n: l.n, ref: l.ref, color: l.color, rot: rots[i], pressed: on,
aria: '맵기 ' + l.n + ', ' + l.ref.replace('\n', ' '),
bg: on ? l.color : 'transparent',
fg: on ? '#F6EFE3' : l.color,
pick: () => this.toggleIn('spicy', l.n)
};
});

let f = 1;
if (s.tteok.length) f *= Math.min(1, s.tteok.reduce((a, t) => a + tteokShare[t], 0));
if (s.style) f *= styleShare[s.style];
if (s.spicy.length) f *= Math.min(1, s.spicy.reduce((a, n) => a + spicyLevels[n - 1].share, 0));
f *= priceShare[s.price] || 1;
if (s.toggles.indexOf('영업 중만') >= 0) f *= 0.7;
if (s.toggles.indexOf('혼밥 가능') >= 0) f *= 0.8;
if (s.toggles.indexOf('‘메뉴에 있음’ 가게도') >= 0) f *= 1.25;
const count = Math.max(1, Math.round(312 * f));

return {
tteoks: tteoks, styles: styles, prices: prices, toggles: toggles, spicy: spicy, count: count,
reset: () => this.setState({ tteok: [], style: null, spicy: [], price: '상관없음', toggles: [] })
};
}
}
</script>
</body>
</html>
