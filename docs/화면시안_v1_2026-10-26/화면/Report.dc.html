<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>떡볶여지도 제보하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Song+Myung&amp;family=Nanum+Pen+Script&amp;display=swap">
<style>
body{margin:0}
a{color:#C00000}a:hover{color:#8E0000}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F6F0E4; font-family: 'Noto Sans KR', sans-serif; color: #1A1614; display: flex; flex-direction: column">

<div style="padding: 8px 12px 0; display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="제보 그만두고 지도로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1614" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-size: 16px; font-weight: 700">제보하기</span>
<span style="width: 44px; text-align: center; font-size: 13px; color: #5C5046">2 / 4</span>
</div>
<div style="padding: 6px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
<span style="height: 4px; border-radius: 2px; background: #C00000"></span>
<span style="height: 4px; border-radius: 2px; background: #C00000"></span>
<span style="height: 4px; border-radius: 2px; background: #DDD0BA"></span>
<span style="height: 4px; border-radius: 2px; background: #DDD0BA"></span>
</div>

<div style="flex-grow: 1; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 6px 0 14px; border-radius: 12px; background: #FBF7EF; border: 1px solid #DDD0BA">
<div style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">합정 쌀떡집</span><span style="font-size: 12px; color: #5C5046">마포구 합정동 · 주소는 자동으로 채웠어요</span></div>
<button type="button" style="height: 44px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #5C5046; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">바꾸기</button>
</div>

<h1 style="margin: 0; font-family: 'Nanum Pen Script', cursive; font-weight: 400; font-size: 36px; line-height: 1.1">어떤 떡볶이였어요?</h1>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 6px"><h2 style="margin: 0; font-size: 15px; font-weight: 700">떡</h2><span style="font-size: 12px; color: #5C5046">여러 개 골라도 돼요</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tteoks}}" as="item" hint-placeholder-count="7">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 6px"><h2 style="margin: 0; font-size: 15px; font-weight: 700">스타일</h2><span style="font-size: 12px; color: #5C5046">하나만</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{styles}}" as="item" hint-placeholder-count="8">
<button type="button" aria-pressed="{{item.pressed}}" onClick="{{item.pick}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid {{item.bd}}; background: {{item.bg}}; color: {{item.fg}}; font: inherit; font-size: 14px; cursor: pointer">{{item.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 6px"><h2 style="margin: 0; font-size: 15px; font-weight: 700">맵기</h2><span style="font-size: 12px; color: #5C5046">아래 라면과 견줘 골라 주세요</span></div>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{spicy}}" as="item" hint-placeholder-count="5">
<button type="button" aria-pressed="{{item.pressed}}" aria-label="{{item.aria}}" onClick="{{item.pick}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; padding: 0; border: 0; background: transparent; font: inherit; cursor: pointer">
<span style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; box-sizing: border-box; border-radius: 3px; border: 2px solid {{item.color}}; background: {{item.bg}}; color: {{item.fg}}; font-family: 'Song Myung', serif; font-size: 23px; transform: rotate({{item.rot}}deg)">{{item.n}}</span>
<span style="font-size: 11px; line-height: 1.3; color: #3B3029; text-align: center; white-space: pre-line">{{item.ref}}</span>
</button>
</sc-for>
</div>
<button type="button" aria-pressed="{{unsure}}" onClick="{{pickUnsure}}" style="align-self: flex-start; height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid {{unsureBd}}; background: {{unsureBg}}; color: {{unsureFg}}; font: inherit; font-size: 13px; cursor: pointer">잘 모르겠어요</button>
</div>

</div>

<div style="padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 54px; border-radius: 12px; border: 0; background: #C00000; color: #F6EFE3; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">다음 · 가격</button>
<p style="margin: 0; text-align: center; font-size: 12px; color: #5C5046">이름 없이 올라가요. 확인되면 지도에 도장이 찍혀요.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tteok: ['쌀떡'], style: '국물', spicy: 3, unsure: false };
}
chip(label, on, pick) {
return {
label: label, pick: pick, pressed: on,
bg: on ? '#1A1614' : '#FBF7EF',
fg: on ? '#F6EFE3' : '#1A1614',
bd: on ? '#1A1614' : '#CDBDA3'
};
}
renderVals() {
const s = this.state;
const tteokNames = ['밀떡', '쌀떡', '누들밀떡', '가래떡', '눈사람떡', '치즈떡', '분모자'];
const styleNames = ['국물', '촉촉', '즉석', '기름', '로제', '짜장', '마라', '궁중'];
const levels = [
{ n: 1, ref: '안 매움', color: '#A6521B' },
{ n: 2, ref: '진라면\n매운맛', color: '#BC3A12' },
{ n: 3, ref: '신라면', color: '#C00000' },
{ n: 4, ref: '불닭\n볶음면', color: '#9E0012' },
{ n: 5, ref: '핵불닭\n이상', color: '#6E0A0E' }
];
const rots = [-3, 2, -2, 3, -4];
return {
tteoks: tteokNames.map((t) => this.chip(t, s.tteok.indexOf(t) >= 0, () => this.setState({ tteok: s.tteok.indexOf(t) >= 0 ? s.tteok.filter((v) => v !== t) : s.tteok.concat([t]) }))),
styles: styleNames.map((t) => this.chip(t, s.style === t, () => this.setState({ style: t }))),
spicy: levels.map((l, i) => {
const on = !s.unsure && s.spicy === l.n;
return {
n: l.n, ref: l.ref, color: l.color, rot: rots[i], pressed: on,
aria: '맵기 ' + l.n + ', ' + l.ref.replace('\n', ' '),
bg: on ? l.color : 'transparent',
fg: on ? '#F6EFE3' : l.color,
pick: () => this.setState({ spicy: l.n, unsure: false })
};
}),
unsure: s.unsure,
pickUnsure: () => this.setState({ unsure: !s.unsure }),
unsureBg: s.unsure ? '#1A1614' : '#FBF7EF',
unsureFg: s.unsure ? '#F6EFE3' : '#1A1614',
unsureBd: s.unsure ? '#1A1614' : '#CDBDA3'
};
}
}
</script>
</body>
</html>
