<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>떡볶여지도 화면 설계 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Song+Myung&family=Nanum+Pen+Script&display=swap">
<style>
/* ───────── 보드(작업 화면) — 데이팅 앱 보드와 같은 틀 ───────── */
:root{
  --t-bg:#1c1c21; --t-panel:#232329; --t-line:#34343c; --t-ink:#ececf1; --t-sub:#9a9aa6;
  --t-canvas:#2b2b32; --t-sel:#4b8bff; --t-wire:#4b8bff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--t-bg);color:var(--t-ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;overflow:hidden}
button,input{font:inherit;color:inherit}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--t-panel);border-bottom:1px solid var(--t-line);position:relative;z-index:5}
.top .brand{font-weight:800;white-space:nowrap}
.top .brand small{color:var(--t-sub);font-weight:500;margin-left:6px}
.modes{display:flex;background:#18181c;border-radius:9px;padding:3px;margin-left:auto;margin-right:auto}
.modes button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--t-sub);font-weight:600}
.modes button.on{background:#34343d;color:var(--t-ink)}
.tools{display:flex;gap:6px;align-items:center}
.tb-btn{border:1px solid var(--t-line);background:#2a2a31;border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.tb-btn.on{border-color:var(--t-sel);color:#cfe0ff}
.zoomv{min-width:52px;text-align:center;color:var(--t-sub);font-variant-numeric:tabular-nums}
.main{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
.layers{width:272px;background:var(--t-panel);border-right:1px solid var(--t-line);overflow:auto;padding:10px 0 30px;flex:none}
.layers h4{margin:16px 14px 8px;font-size:12px;color:var(--t-sub);font-weight:600;letter-spacing:.3px}
.layers h4:first-child{margin-top:4px}
.layers h4 small{font-weight:400;margin-left:6px}
.layers a{display:flex;gap:8px;align-items:baseline;padding:5px 14px;color:var(--t-ink);text-decoration:none;cursor:pointer;font-size:13px}
.layers a span{color:var(--t-sub);font-size:11px;font-variant-numeric:tabular-nums;min-width:44px}
.layers a:hover{background:#2c2c34}
.layers a.on{background:#2b3a5c}
/* 팔레트 칸 */
.palp{padding:0 14px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pchip{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:8px;border:1px solid var(--t-line);background:#2a2a31;cursor:pointer;text-align:left}
.pchip.on{border-color:var(--t-sel);box-shadow:0 0 0 1px var(--t-sel)}
.pchip i{display:flex;height:12px;border-radius:3px;overflow:hidden}
.pchip i b{flex:1}
.pchip i b:first-child{flex:2}
.pchip span{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgroup{font-size:11px;color:var(--t-sub);margin:8px 0 5px}
.pk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.pk span{flex:1}
.pk input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--t-line);border-radius:6px;background:none;cursor:pointer}
.pk code{width:62px;color:var(--t-sub);font-size:11px;font-family:ui-monospace,Consolas,monospace}
.crbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:#1b1b20;font-size:12px;line-height:1.75;color:var(--t-sub)}
.crbox b{color:var(--t-ink)}
.crbox .bad{color:#ff8a7a}
.seg3{display:flex;gap:4px}
.seg3 button{flex:1;border:1px solid var(--t-line);background:#2a2a31;border-radius:7px;padding:5px 0;cursor:pointer;font-size:12.5px}
.seg3 button.on{border-color:var(--t-sel);background:#2b3a5c;color:#dfe9ff;font-weight:700}
.pbtns{display:flex;gap:6px;margin-top:10px}
.pbtns button{flex:1;border:1px solid var(--t-line);background:#2a2a31;border-radius:7px;padding:6px 0;cursor:pointer;font-size:12px}
.pout{display:none;width:100%;margin-top:6px;height:96px;background:#1b1b20;color:var(--t-ink);border:1px solid var(--t-line);border-radius:7px;font:11px/1.4 ui-monospace,Consolas,monospace;padding:6px}
.stage{flex:1;position:relative;overflow:hidden;background:var(--t-canvas);cursor:grab;
  background-image:radial-gradient(#3a3a43 1px,transparent 1px);background-size:24px 24px}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.lane-t{position:absolute;font-size:30px;font-weight:800;color:#d9d9e2;white-space:nowrap}
.lane-t small{display:block;font-size:20px;font-weight:500;color:var(--t-sub);margin-top:4px}
.ab{position:absolute;width:390px}
.ab .lbl{position:absolute;bottom:100%;left:0;margin-bottom:10px;font-size:18px;color:var(--t-sub);white-space:nowrap}
.ab .lbl b{color:#d6d6de;font-weight:600;margin-left:8px}
.ab .frame{width:390px;height:844px;overflow:hidden;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35);background:#fff;cursor:pointer;outline:0 solid var(--t-sel);transition:outline-width .1s}
.ab .frame .scr{pointer-events:none}
.ab.sel .frame{outline-width:5px}
svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:3}
svg.wires path{fill:none;stroke:var(--t-wire);stroke-width:2.4;opacity:.95;vector-effect:non-scaling-stroke}
svg.wires path.hi{stroke-width:4;opacity:1}
svg.wires circle{fill:var(--t-wire);opacity:1}
svg.wires .lo{opacity:.08}
svg.wires .pill rect{fill:var(--t-panel);stroke:var(--t-wire);stroke-width:1.2;vector-effect:non-scaling-stroke}
svg.wires .pill text{fill:var(--t-wire);font-weight:700;font-family:inherit}
svg.wires .pill.lo{opacity:.15}
.insp{width:300px;background:var(--t-panel);border-left:1px solid var(--t-line);overflow:auto;padding:16px;flex:none}
.insp .code{color:var(--t-sel);font-weight:700;font-size:12px}
.insp h3{margin:2px 0 4px;font-size:18px}
.insp .flow{color:var(--t-sub);font-size:12px;margin-bottom:12px}
.insp h5{margin:16px 0 6px;font-size:12px;color:var(--t-sub);font-weight:600}
.insp ul{margin:0;padding-left:18px;line-height:1.6;font-size:13px}
.insp .go a{display:block;padding:6px 10px;border:1px solid var(--t-line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.insp .go a:hover{border-color:var(--t-sel)}
.insp .go a em{font-style:normal;color:var(--t-sub);font-size:12px}
.insp .play{width:100%;margin-top:14px;border:0;background:var(--t-sel);color:#fff;border-radius:9px;padding:10px;font-weight:700;cursor:pointer}
.insp .empty{color:var(--t-sub);line-height:1.7}
.insp .empty kbd{background:#33333b;border-radius:4px;padding:1px 6px;font-size:12px}
.tag-note{display:inline-block;background:#3a2f1a;color:#f2c46b;border-radius:6px;padding:2px 8px;font-size:11.5px;margin-top:4px}

/* 라이트 모드 */
body.light{
  --t-bg:#eef0f4; --t-panel:#ffffff; --t-line:#dcdfe6; --t-ink:#1f2330; --t-sub:#6b7180;
  --t-canvas:#e9ebf0; --t-sel:#2f6bff; --t-wire:#f0592a;
}
body.light .modes{background:#e7e9ef}
body.light .modes button.on{background:#fff;color:var(--t-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.light .tb-btn,body.light .pchip,body.light .seg3 button,body.light .pbtns button{background:#f6f7f9}
body.light .tb-btn.on{color:#1f4fd6;background:#eaf0ff}
body.light .seg3 button.on{background:#e3ebff;color:#1f4fd6}
body.light .crbox,body.light .pout{background:#f3f4f7}
body.light .layers a:hover{background:#f1f3f7}
body.light .layers a.on{background:#e3ebff}
body.light .stage{background-image:radial-gradient(#c9cdd6 1px,transparent 1px)}
body.light .lane-t{color:#1f2330}
body.light .ab .lbl b{color:#2a2f3c}
body.light .ab .frame{box-shadow:0 6px 24px rgba(20,30,60,.16),0 0 0 1px rgba(20,30,60,.08)}
body.light .insp .empty kbd{background:#eceef3}
body.light .tag-note{background:#fff3d6;color:#8a5a00}
body.light .proto{background:#e4e6ec}

/* 프로토타입 모드 (왼쪽 팔레트·화면 목록은 그대로 보인다) */
.proto{position:absolute;top:0;bottom:0;left:272px;right:0;background:#111114;display:none;align-items:center;justify-content:center;gap:28px;z-index:4}
.proto.on{display:flex}
.proto .side{width:250px;color:var(--t-sub);font-size:13px;line-height:1.7;flex:none}
.proto .side .code{color:var(--t-sel);font-weight:700}
.proto .side h3{color:var(--t-ink);margin:2px 0 8px;font-size:20px}
.proto .side .hint{margin-top:16px;border-top:1px solid var(--t-line);padding-top:12px}
.proto .side .tb-btn{margin:4px 4px 0 0}
.phones{display:flex;gap:28px;align-items:center;transform-origin:center center;flex:none}
.pwrap{position:relative}
.plabel{position:absolute;bottom:100%;left:0;right:0;margin-bottom:10px;text-align:center;font-size:14px;font-weight:700;color:var(--t-ink)}
.plabel small{display:block;font-weight:400;font-size:12px;color:var(--t-sub)}
.phone{position:relative;width:414px;height:868px;border-radius:58px;background:#000;padding:12px;box-shadow:0 0 0 2px #3b3b42,0 30px 80px rgba(0,0,0,.6);flex:none}
.phone .island{display:none}
.phone .vp{width:390px;height:844px;border-radius:46px;overflow-x:hidden;overflow-y:auto;position:relative;background:#fff;scrollbar-width:none}
.phone .vp::-webkit-scrollbar{display:none}
.vp .pg{position:relative;min-height:100%}
.vp .pg.in-r{animation:inR .28s ease}
.vp .pg.in-l{animation:inL .28s ease}
@keyframes inR{from{transform:translateX(40%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40%);opacity:0}to{transform:none;opacity:1}}
.vp.flash [data-go],.vp.flash [data-act],.vp.flash [data-alert]{outline:2px solid rgba(75,139,255,.9);outline-offset:1px}
.vp.hs [data-go],.vp.hs [data-alert]{outline:2px dashed rgba(75,139,255,.85);outline-offset:1px}
.v1note{position:absolute;left:24px;right:24px;top:360px;padding:14px 16px;border-radius:12px;background:rgba(20,20,22,.88);color:#fff;font-size:14px;line-height:1.55;text-align:center;z-index:5}

/* ───────── 앱 화면 (폰 안) — 색은 모두 팔레트 변수 ───────── */
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.2px}
.scr.tall{height:1480px}
.scr *{box-sizing:border-box}
.scr.v1img{background:#fff}
.scr.v1img img{display:block;width:390px}
.scr [data-go],.scr [data-act],.scr [data-alert]{cursor:pointer}
.scr .map{position:absolute;left:0;top:0;width:390px;height:844px}
.lbls{position:absolute;left:0;top:0;width:390px;height:844px;font-family:"Song Myung",serif;font-size:13px;color:var(--label);text-shadow:0 0 2px var(--paper),0 0 2px var(--paper),0 0 4px var(--paper);pointer-events:none}
.lbls span{position:absolute}
.tbar{position:absolute;left:0;top:0;width:390px;padding:10px 12px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:3}
.tbar .r1{display:flex;align-items:center;gap:10px}
.sign{width:96px;height:31px;flex:none;filter:var(--logo-filter)}
.search{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink3);font-size:14px}
.chips{display:flex;gap:6px;overflow:hidden}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:5px;height:36px;padding:0 12px;border-radius:18px;background:var(--surface);border:1px solid var(--chipline);color:var(--ink);font-size:13px;white-space:nowrap}
.chip.lg{height:40px;padding:0 16px;border-radius:20px;font-size:15px}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--onprimary);font-weight:700}
.st{position:absolute;display:flex;align-items:center;justify-content:center;font-family:"Song Myung",serif;box-shadow:var(--pin-shadow)}
.st.b{width:30px;height:30px;padding:2px;border-radius:3px}
.st.b i{font-style:normal;display:flex;align-items:center;justify-content:center;width:100%;height:100%;border:1px solid var(--e);border-radius:2px;font-size:16px}
.st.m{width:20px;height:20px;border-radius:2px;font-size:12px}
.st.big{width:44px;height:44px;padding:3px;border-radius:4px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--selring)}
.st.big i{font-size:22px;border-width:1.5px}
.st.in{position:relative;flex:none}
.st.old{opacity:.42}
.s1{background:var(--s1);color:var(--s1f);--e:var(--s1e)} .s2{background:var(--s2);color:var(--s2f);--e:var(--s2e)}
.s3{background:var(--s3);color:var(--s3f);--e:var(--s3e)} .s4{background:var(--s4);color:var(--s4f);--e:var(--s4e)}
.s5{background:var(--s5);color:var(--s5f);--e:var(--s5e)}
.s1c{--c:var(--s1)}.s2c{--c:var(--s2)}.s3c{--c:var(--s3)}.s4c{--c:var(--s4)}.s5c{--c:var(--s5)}
.pc{position:absolute;display:flex;align-items:center;gap:1px;height:24px;padding:0 5px;border-radius:12px;background:var(--surface);border:2px solid var(--c);color:#D12F2A;box-shadow:var(--pin-shadow)}
.pc.in{position:relative;flex:none}
.pc.big{height:34px;padding:0 9px;gap:2px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--selring)}
.pc.old,.ph.old{opacity:.42}
.ph{position:absolute;display:block;line-height:0}
.ph.in{position:relative;flex:none}
.ph svg{display:block;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.mp a .sq.ch{background:var(--surface);border:2px solid var(--c);color:#D12F2A;flex-wrap:wrap;align-content:center;justify-content:center;gap:0;padding:2px}
.mp a .sq.hp{background:none}
.nm{position:absolute;padding:3px 8px;border-radius:4px;background:var(--namebg);color:var(--nametext);font-size:13px;font-weight:700;white-space:nowrap}
.pl{position:absolute;padding:1px 6px;border-radius:4px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--ink2);white-space:nowrap}
.cl{position:absolute;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--cluster);border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--cluster);color:var(--oncluster);font-family:"Song Myung",serif;font-size:15px}
.loc{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--lochalo)}
.loc::after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--loc);border:2px solid var(--surface)}
.pills{position:absolute;left:12px;right:12px;top:120px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.pill{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--bar);border:1px solid var(--line);font-size:12px;color:var(--ink2);white-space:nowrap}
.rbtn{position:absolute;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--chipline);background:var(--surface);color:var(--loc);box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:2}
.zoomc{position:absolute;left:330px;top:398px;width:44px;border-radius:22px;border:1px solid var(--chipline);background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;z-index:2}
.zoomc b{display:flex;align-items:center;justify-content:center;height:44px;font-size:22px;font-weight:500;color:var(--ink)}
.zoomc b+b{border-top:1px solid var(--line)}
.fab{position:absolute;left:318px;top:552px;width:58px;height:58px;border-radius:50%;background:var(--fab);color:var(--onfab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.28);z-index:2}
.card{position:absolute;left:12px;top:622px;width:366px;padding:14px 14px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px var(--cardshadow);display:flex;flex-direction:column;gap:8px;z-index:2}
.card .h{display:flex;align-items:center;gap:10px}
.card .t{font-size:17px;font-weight:700}
.kind{padding:1px 6px;border-radius:4px;border:1px solid var(--tagline);color:var(--tagtext);font-size:11px;font-weight:500;white-space:nowrap}
.tg{padding:3px 8px;border-radius:12px;background:var(--chip);font-size:12px;color:var(--ink2)}
.tg.sp{background:var(--spicybg);color:var(--spicytext)}
.sub{color:var(--ink2)} .mute{color:var(--ink3)} .acc{color:var(--accent);font-weight:700}
.nav{position:absolute;left:0;bottom:0;width:390px;height:68px;padding:6px 8px 10px;background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:3}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:11px}
.nav a.on{color:var(--accent);font-weight:700}
.nav svg{width:22px;height:22px}
.real{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden}
.real svg{position:absolute;left:0;top:0;width:390px;height:844px}
body.edge-fade .real{-webkit-mask-image:radial-gradient(ellipse 70% 54% at 50% 50%,#000 48%,transparent 100%);mask-image:radial-gradient(ellipse 70% 54% at 50% 50%,#000 48%,transparent 100%)}
.blurov{display:none;position:absolute;left:0;top:0;width:390px;height:844px;background:var(--paper-a);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);-webkit-mask-image:radial-gradient(ellipse 70% 54% at 50% 50%,transparent 46%,#000 86%);mask-image:radial-gradient(ellipse 70% 54% at 50% 50%,transparent 46%,#000 86%)}
body.edge-blur .blurov{display:block}
body.edge-frame .real{left:12px;top:112px;width:366px;height:498px;border-radius:14px;border:1px solid var(--chipline);box-shadow:0 2px 10px var(--cardshadow)}
body.edge-frame .real svg{left:-12px;top:-112px}
.slbl{position:absolute;font-size:11px;font-weight:500;color:var(--ink3);text-shadow:0 0 2px var(--surface),0 0 2px var(--surface)}
.stn{position:absolute;display:flex;align-items:center;gap:4px}
.stn i{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink2);color:var(--surface);font-size:10px;font-weight:700;font-style:normal}
.stn b{font-size:12px;text-shadow:0 0 2px var(--surface),0 0 3px var(--surface)}
.seg{position:absolute;left:12px;top:120px;display:flex;padding:3px;border-radius:16px;background:var(--bar);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2}
.seg a{display:flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;color:var(--ink3)}
.seg a.on{background:var(--primary);color:var(--onprimary);font-weight:700}
.note{position:absolute;right:12px;top:126px;padding:3px 8px;border-radius:10px;background:var(--bar);border:1px solid var(--line);font-size:11px;color:var(--ink3);z-index:2}
.attr{position:absolute;padding:2px 6px;border-radius:3px;background:var(--surface);border:1px dashed var(--ink3);font-size:10px;color:var(--ink2);z-index:2}
.scl{position:absolute;left:262px;top:592px;font-size:10px;color:var(--ink2);z-index:2}
.scl i{display:block;width:46px;height:4px;border:1.5px solid var(--ink2);border-top:0}
.hd{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:var(--bar);border-bottom:1px solid var(--line)}
.hd b{font-size:16px}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:var(--ink)}
.bd{padding:16px;display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:52px;border-radius:12px;font-size:15px;font-weight:700}
.btn.pri{background:var(--primary);color:var(--onprimary)}
.btn.out{border:1px solid var(--chipline);background:var(--surface);color:var(--ink)}
.sec{font-size:15px;font-weight:700}
.sec small{margin-left:6px;font-size:12px;font-weight:400;color:var(--ink3)}
.pen{font-family:"Nanum Pen Script",cursive;font-size:32px;line-height:1.1}
.mp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mp a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:1.35;color:var(--ink2);text-align:center}
.mp a .sq{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:4px;font-family:"Song Myung",serif;font-size:22px;opacity:.38}
.mp a.on .sq{opacity:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dim{position:absolute;left:0;top:0;width:390px;height:844px;background:rgba(0,0,0,.42)}
.sheet{position:absolute;left:0;right:0;top:92px;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 20px 0;display:flex;flex-direction:column;gap:13px}
.handle{width:40px;height:4px;border-radius:2px;background:var(--chipline);margin:0 auto}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 20px}
.prog i{height:4px;border-radius:2px;background:var(--chip)}
.prog i.on{background:var(--primary)}
.lrow{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.doc{height:844px;padding:28px 30px;background:#FFFFFF;color:#1C1C1B;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.dlg-wrap{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{width:300px;padding:20px;border-radius:16px;background:var(--surface);color:var(--ink);text-align:center}
.dlg b{font-size:16px}
.dlg p{margin:8px 0 14px;color:var(--ink2);font-size:13.5px;line-height:1.55}
.dlg button{width:100%;height:44px;border:0;border-radius:10px;background:var(--primary);color:var(--onprimary);font-weight:700;cursor:pointer}
</style>
</head>

const RAMP_NIGHT = [['#F6C08A','#2B1006','rgba(43,16,6,.38)'],['#EE8752','#2B1006','rgba(43,16,6,.38)'],['#C92A30','#FFF4E6','rgba(255,244,230,.85)'],['#9C1430','#FFF4E6','rgba(255,244,230,.85)'],['#6C0E22','#FFF4E6','rgba(255,244,230,.85)']];
const RAMP_V1 = ['#A6521B','#BC3A12','#C00000','#9E0012','#6E0A0E'].map(c => [c,'#F6EFE3','rgba(246,239,227,.75)']);

const hex = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
const toHex = a => '#' + a.map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return toHex(x.map((v,i) => v + (y[i]-v)*t)); };
const lum = h => { const f = c => (c /= 255) <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); const [r,g,b] = hex(h).map(f); return .2126*r + .7152*g + .0722*b; };
const cr = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
const rgba = (h, a) => { const [r,g,b] = hex(h); return `rgba(${r},${g},${b},${a})`; };
const onColor = bg => cr('#FFFFFF', bg) >= cr('#141414', bg) ? '#FFFFFF' : '#141414';
// 누런 기(b*) 조절용 Lab 변환
const LW = [.95047, 1, 1.08883];
const labOf = h => { const f = c => (c /= 255) <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); const [r, g, b] = hex(h).map(f);
  const X = (.4124 * r + .3576 * g + .1805 * b) / LW[0], Y = .2126 * r + .7152 * g + .0722 * b, Z = (.0193 * r + .1192 * g + .9505 * b) / LW[2];
  const t = v => v > .008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116; return [116 * t(Y) - 16, 500 * (t(X) - t(Y)), 200 * (t(Y) - t(Z))]; };
const hexOfLab = (L, a, b) => { const fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200, g = t => t ** 3 > .008856 ? t ** 3 : (t - 16 / 116) / 7.787;
  const X = g(fx) * LW[0], Y = g(fy), Z = g(fz) * LW[2], u = c => c <= .0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - .055;
  return toHex([3.2406 * X - 1.5372 * Y - .4986 * Z, -.9689 * X + 1.8758 * Y + .0415 * Z, .0557 * X - .2040 * Y + 1.0570 * Z].map(c => u(Math.max(0, Math.min(1, c))) * 255)); };

function derive(B, v1) {
  const dark = lum(B.paper) < .2;
  let ink3 = mix(B.ink, B.surface, .42);
  for (let t = .42; t > .18 && cr(ink3, B.surface) < 4.6; t -= .02) ink3 = mix(B.ink, B.surface, t);
  const bar = dark ? mix(B.paper, '#000000', .28) : mix(B.surface, B.paper, .35);
  const ramp = v1 ? RAMP_V1 : (dark ? RAMP_NIGHT : RAMP_LIGHT);

    bar, line:mix(bar, B.ink, .14), chip:mix(B.surface, B.ink, dark ? .1 : .055), chipline:mix(B.surface, B.ink, .2),

    'paper-a':rgba(B.paper, .55),
    label:mix(B.ink, B.paper, .1), 'm-ink':mix(B.ink, B.paper, dark ? .35 : .25), 'm-ink2':mix(B.ink, B.paper, .1), 'm-road':mix(B.ink, B.paper, .08),
    'm-water':B.water, 'm-wave':mix(B.water, dark ? '#FFFFFF' : B.ink, .18), 'm-bank':bank, 'm-seam':mix(B.paper, B.ink, .28),
    river:bank, district:mix(B.ink, B.paper, .22), hangang:mix(bank, B.ink, .3),

    's-case':dark ? mix(B.paper, '#000000', .3) : mix(B.paper, B.ink, .16), 's-main':dark ? mix(B.paper, '#FFFFFF', .2) : '#FFFFFF',
    's-maincase':dark ? mix(B.paper, '#000000', .38) : mix(B.paper, B.ink, .22), 's-express':dark ? mix(B.paper, '#FFFFFF', .28) : mix(B.paper, '#FFFFFF', .55),
    's-park':mix(B.paper, '#7FA87F', .18)
  };
  ramp.forEach(([bg, fg, e], i) => { T['s' + (i+1)] = bg; T['s' + (i+1) + 'f'] = fg; T['s' + (i+1) + 'e'] = e; });
  return { T, dark };
}

let PAL = { preset:'N1', base:{ ...PRESETS[6].b }, custom:false, edge:'fade', compare:true };
try { const s = JSON.parse(localStorage.getItem('ddb-board') || 'null'); if (s && s.base) PAL = { ...PAL, ...s }; } catch (e) {}
const presetOf = id => PRESETS.find(p => p.id === id) || PRESETS[6];
const palName = () => PAL.custom ? `직접 만든 팔레트 (${presetOf(PAL.preset).name} 바탕)` : presetOf(PAL.preset).name;

function applyPalette() {

function renderPal(T) {

/* ═════════ 보드 배치 ═════════ */
const AW = 390, AH = 844, GX = 190, TOP_PAD = 180, LANE_GAP = 220, SUB_GAP = 0;
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const W = s => s.w || AW, H = s => s.h || AH;
let y = 0; const laneY = {};
LANES.forEach(L => {
  laneY[L.id] = y + TOP_PAD;
  const ls = S.filter(s => s.lane === L.id), lh = Math.max(...ls.map(H));
  y += TOP_PAD + lh + LANE_GAP;
});
S.forEach(s => { s.x = s.col * (W(s) + GX); s.y = laneY[s.lane]; });
LANES.filter(L => L.flow).forEach(L => { let x = 0; S.filter(s => s.lane === L.id).forEach(s => { s.x = x; x += W(s) + GX; }); });
const WORLD_W = Math.max(...S.map(s => s.x + W(s))), WORLD_H = y;

const world = document.getElementById('world'), stage = document.getElementById('stage'), wires = document.getElementById('wires');
let view = { x: 40, y: 40, k: .3 }, sel = null, wireMode = 'clean';
LANES.forEach(L => {
  const d = document.createElement('div'); d.className = 'lane-t';
  d.style.left = '0px'; d.style.top = (laneY[L.id] - 130) + 'px';
  d.innerHTML = `${L.t}<small>${L.s}</small>`; world.appendChild(d);
});
S.forEach(s => {
  const d = document.createElement('div'); d.className = 'ab'; d.id = 'ab-' + s.id;
  d.style.left = s.x + 'px'; d.style.top = s.y + 'px';
  d.style.width = W(s) + 'px';
  d.innerHTML = `<div class="lbl">${s.code}<b>${s.t}</b></div><div class="frame" style="width:${W(s)}px;height:${H(s)}px">${s.html()}</div>`;
  d.querySelector('.frame').addEventListener('click', e => { e.stopPropagation(); select(s.id); });
  d.querySelector('.frame').addEventListener('dblclick', e => { e.stopPropagation(); if (s.isDoc) focus(s.id); else openProto(s.isV1 ? s.to : s.id); });
  world.appendChild(d);
});

function apply() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  if (links.length && Math.abs((drawWires.k || 0) - view.k) > .001) drawWires();
  document.getElementById('zv').textContent = Math.round(view.k * 100) + '%';
}
function fit(widthOnly) {
  const r = stage.getBoundingClientRect(), pad = 50;
  let k = (r.width - pad * 2) / WORLD_W;
  if (!widthOnly) k = Math.min(k, (r.height - pad * 2) / (WORLD_H - LANE_GAP + 20));
  view.k = Math.min(k, 1); view.x = (r.width - WORLD_W * view.k) / 2; view.y = pad; apply();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(2, Math.max(.06, view.k * f));
  view.x = cx - (cx - view.x) * (k / view.k); view.y = cy - (cy - view.y) * (k / view.k); view.k = k; apply();
}
function focus(id) {
  const s = byId[id], r = stage.getBoundingClientRect();
  const k = Math.min(1, (r.height - 120) / Math.min(H(s), 900), (r.width - 80) / W(s));
  view.k = k; view.x = r.width / 2 - (s.x + W(s) / 2) * k; view.y = r.height / 2 - (s.y + Math.min(H(s), 900) / 2) * k; apply(); select(id);
}

/* 연결선 (데이팅 앱 보드와 같은 방식) */
let links = [];
function buildLinks() {
  links = [];
  const wr = world.getBoundingClientRect();
  S.forEach(s => {
    if (s.isV1 || s.isDoc) return;
    document.getElementById('ab-' + s.id).querySelectorAll('[data-go]').forEach(el => {
      const to = el.dataset.go;
      if (to === 'back' || !byId[to] || to === s.id || el.closest('.nav, .chips')) return;
      const r = el.getBoundingClientRect();
      links.push({ from: s.id, to, ex: (r.left - wr.left) / view.k, ey: (r.top - wr.top) / view.k, ew: r.width / view.k, eh: r.height / view.k, label: (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24) });
    });
  });
  drawWires();
}
function rerenderAll() { // 맵기 표시를 바꾸면 화면을 새로 그리고 연결선도 다시 잰다
  S.forEach(s => { if (s.isV1) return; const f = document.querySelector('#ab-' + s.id + ' .frame'); if (f) f.innerHTML = s.html(); });
  const k0 = view.k; view.k = 1; apply(); buildLinks(); view.k = k0; apply();
  if (mode === 'proto' && cur) render(cur);
}
function drawWires() {
  drawWires.k = view.k;
  wires.setAttribute('width', WORLD_W); wires.setAttribute('height', WORLD_H);
  if (wireMode === 'off') { wires.innerHTML = ''; return; }
  const u = 1 / view.k, out = [], seen = new Set(), pillN = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  links.forEach(l => {
    const key = l.from + '>' + l.to; if (seen.has(key)) return; seen.add(key);
    const f = byId[l.from], t = byId[l.to];
    const next = f.lane === t.lane && t.col === f.col + 1;
    const cls = !sel ? '' : (l.from === sel || l.to === sel) ? 'hi' : 'lo';
    const bx = Math.min(l.ex + l.ew, f.x + W(f)), sy = clamp(l.ey + l.eh / 2, f.y + 30, f.y + H(f) - 30);
    const fx = f.x + W(f);
    const dot = `<circle class="${cls}" cx="${bx}" cy="${sy}" r="${3.5 * u}"/>`;
    if (next) {
      const tx = t.x, ty = clamp(sy, t.y + 40, t.y + H(t) - 40), mx = (fx + tx) / 2;
      const r = Math.min(14, Math.abs(ty - sy) / 2), dir = ty > sy ? 1 : -1;
      const d = Math.abs(ty - sy) < 2 ? `M${bx},${sy} H${tx}` : `M${bx},${sy} H${mx - r} Q${mx},${sy} ${mx},${sy + r * dir} V${ty - r * dir} Q${mx},${ty} ${mx + r},${ty} H${tx}`;
      out.push(`<path class="${cls}" d="${d}"/>${dot}<path class="${cls}" d="M${tx - 9 * u},${ty - 6 * u} L${tx},${ty} L${tx - 9 * u},${ty + 6 * u}"/>`);
    } else if (wireMode === 'all' || cls === 'hi') {
      const right = t.x > f.x;
      const sx = right ? fx : f.x, tx = right ? t.x : t.x + W(t), ty = t.y + 70;
      const dx = Math.max(80, Math.abs(tx - sx) * .45) * (right ? 1 : -1), ah = 9 * u * (right ? 1 : -1);
      out.push(`<path class="${cls}" d="M${bx},${sy} H${sx} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}"/>${dot}<path class="${cls}" d="M${tx - ah},${ty - 6 * u} L${tx},${ty} L${tx - ah},${ty + 6 * u}"/>`);
    } else {
      const n = pillN[l.from + Math.round(sy / 40)] = (pillN[l.from + Math.round(sy / 40)] || 0) + 1;
      const fs = Math.min(11 * u, 16), ph = fs * 1.7, py = sy + (n - 1) * (ph + 4) - ph / 2;
      const px = fx + Math.min(8 * u, 8), room = GX - 14;
      const pwOf = x => fs * (0.62 * x.length + 1.6);
      let txt = '→ ' + t.code + ' ' + t.t; if (pwOf(txt) > room) txt = '→ ' + t.code;
      const pw = pwOf(txt);
      out.push(`<g class="pill ${cls}"><title>${t.code} ${t.t}</title><path d="M${bx},${sy} H${px}" style="stroke-dasharray:${3 * u} ${3 * u}"/>${dot}<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${ph / 2}"/><text x="${px + fs * .8}" y="${py + ph * .68}" font-size="${fs}">${txt}</text></g>`);
    }
  });
  wires.innerHTML = out.join('');
}
function select(id) {

  document.querySelectorAll('.ab').forEach(a => a.classList.toggle('sel', a.id === 'ab-' + id));
  document.querySelectorAll('#layers a').forEach(a => a.classList.toggle('on', a.dataset.id === id));

    ${ins.length ? `<h5>여기로 오는 곳</h5><div class="go">${ins.map(i => `<a data-f="${i}">${byId[i].t}</a>`).join('')}</div>` : ''}

/* 팬·줌 */
let drag = null;
stage.addEventListener('pointerdown', e => { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; stage.classList.add('drag'); }
  view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
});
stage.addEventListener('pointerup', e => {
  if (drag && !drag.moved) {
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains('frame'));
    if (hit) select(hit.parentElement.id.slice(3)); else select(null);
  }
  drag = null; stage.classList.remove('drag');
});
stage.addEventListener('dblclick', e => {
  const hit = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains('frame'));
  if (hit) { const s = byId[hit.parentElement.id.slice(3)]; if (s.isDoc) focus(s.id); else openProto(s.isV1 ? s.to : s.id); }
});
stage.addEventListener('wheel', e => {
  e.preventDefault(); const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= 50 && !e.deltaX) zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, { passive: false });

}
function alertBox(n) {
  const [t, d, b] = ALERTS[n]; const scr = vp.querySelector('.scr');
  const w = document.createElement('div'); w.className = 'dlg-wrap';
  w.innerHTML = `<div class="dlg"><b>${t}</b><p>${d}</p><button>${b}</button></div>`;
  w.onclick = ev => { if (ev.target === w || ev.target.tagName === 'BUTTON') w.remove(); };
  scr.appendChild(w);
}
vp.addEventListener('click', e => {
  if (e.target.closest('.dlg-wrap')) return;
  const g = e.target.closest('[data-go]'), a = e.target.closest('[data-act]'), al = e.target.closest('[data-alert]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'chip') a.classList.toggle('on');
    if (act === 'pick') { a.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); a.classList.add('on'); }
    if (act === 'pickmp') { a.parentElement.querySelectorAll('a').forEach(c => c.classList.remove('on')); a.classList.add('on'); }
    return;
  }
  if (al) { alertBox(al.dataset.alert); return; }
  if (g) { go(g.dataset.go); return; }
  vp.classList.remove('flash'); void vp.offsetWidth; vp.classList.add('flash');
  clearTimeout(vp._t); vp._t = setTimeout(() => vp.classList.remove('flash'), 650);
});
function fitPhone() {
  const r = proto.getBoundingClientRect(), two = PAL.compare;
  const need = two ? 414 * 2 + 28 : 414, side = 250 + 28;
  const k = Math.min(1, (r.height - 90) / 868, (r.width - side - 40) / need);
  phones.style.transform = `scale(${k})`;
  phones.style.margin = `${-(868 * (1 - k)) / 2 + 20}px ${-(need * (1 - k)) / 2}px 0`;
}

/* ═════════ 상단 버튼 · 키 ═════════ */
document.getElementById('mDesign').onclick = () => mode === 'proto' && closeProto();
document.getElementById('mProto').onclick = () => mode !== 'proto' && openProto(!sel || byId[sel].isDoc ? 'intro' : (byId[sel].isV1 ? byId[sel].to : sel));
document.getElementById('tChar').onclick = () => { if (mode === 'proto') closeProto(); focus('ch_all'); };
document.getElementById('tSpicy').onclick = () => { if (mode === 'proto') closeProto(); focus('sp_all'); };
document.getElementById('tFit').onclick = () => mode === 'proto' ? null : fit();
document.getElementById('tIn').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
document.getElementById('tOut').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(.8, r.width / 2, r.height / 2); };
const WIRE_LBL = { clean: '연결선: 정리', all: '연결선: 전체', off: '연결선: 끔' };
document.getElementById('tWire').onclick = e => {
  wireMode = { clean: 'all', all: 'off', off: 'clean' }[wireMode];
  e.currentTarget.textContent = WIRE_LBL[wireMode]; e.currentTarget.classList.toggle('on', wireMode !== 'off'); drawWires();
};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape' && mode === 'proto') closeProto();
  if (mode === 'proto') { if (e.key === 'Backspace' || e.key === 'ArrowLeft') go('back'); return; }
  if (e.key === '0') fit();
  if (e.key === '1') fit(true);
  if (e.key === '+' || e.key === '=') document.getElementById('tIn').click();
  if (e.key === '-') document.getElementById('tOut').click();
  if (e.key === 'w' || e.key === 'W') document.getElementById('tWire').click();
  if (e.key === 'p' || e.key === 'P') document.getElementById('mProto').click();
});
addEventListener('resize', () => { if (mode === 'proto') fitPhone(); });

/* 시작 */
applyPalette(); renderLayers(); renderInsp(); apply();
const start = () => {
  const k0 = view.k; view.k = 1; apply(); buildLinks(); view.k = k0;
  fit(true);
  const q = new URLSearchParams(location.search);
  if (q.get('pal')) { const p = presetOf(q.get('pal')); PAL.preset = p.id; PAL.base = { ...p.b }; PAL.custom = false; applyPalette(); }
  if (q.get('edge')) { PAL.edge = q.get('edge'); applyPalette(); }
  if (q.get('cmp')) { PAL.compare = q.get('cmp') === '1'; }
  if (q.get('sp')) { PAL.spicy = q.get('sp'); applyPalette(); rerenderAll(); }
  if (q.get('focus') && byId[q.get('focus')]) focus(q.get('focus'));
  const h = location.hash.slice(1); if (h && byId[h]) openProto(h);
};
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);

/* 라이트 / 다크 모드 (이 브라우저에만 기억) */
(() => {
  const btn = document.getElementById('tTheme');
  const set = light => { document.body.classList.toggle('light', light); btn.textContent = light ? '🌙 다크' : '☀ 라이트'; };
  let saved = new URLSearchParams(location.search).get('theme'); if (!saved) try { saved = localStorage.getItem('board-theme'); } catch (e) {}
  set(saved === 'light');
  btn.addEventListener('click', () => {
    const light = !document.body.classList.contains('light'); set(light);
    try { localStorage.setItem('board-theme', light ? 'light' : 'dark'); } catch (e) {}
  });
})();
</script>
