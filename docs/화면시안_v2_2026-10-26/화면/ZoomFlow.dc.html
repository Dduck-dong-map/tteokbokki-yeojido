<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 지도에서 실제 지도로 넘어가는 흐름</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Song+Myung&amp;display=swap">
<style>
body{margin:0}
a{color:#2D5B9A}a:hover{color:#1E3A64}
</style>
</helmet>
<div style="width: 1450px; height: 1140px; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 18px; background: #ECECE9; font-family: 'Noto Sans KR', sans-serif; color: #1C1C1B">

<div style="display: grid; grid-template-columns: 390px 100px 390px 100px 390px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 6px; height: 92px">
<span style="font-size: 13px; color: #62625F">① 둘러볼 때 · 구·동네 단위</span>
<b style="font-size: 21px">그림 지도</b>
<span style="font-size: 14px; line-height: 1.5; color: #3D3D3B">대동여지도 느낌으로 어느 동네에 어떤 맵기 집이 모였는지 본다.</span>
</div>
<span></span>
<div style="display: flex; flex-direction: column; gap: 6px; height: 92px">
<span style="font-size: 13px; color: #62625F">② 확대하면 · 골목 단위</span>
<b style="font-size: 21px">실제 지도 (네이버)</b>
<span style="font-size: 14px; line-height: 1.5; color: #3D3D3B">가운데는 네이버 지도로 정확한 골목과 역이 보이고, 가장자리는 그림 지도로 번진다.</span>
</div>
<span></span>
<div style="display: flex; flex-direction: column; gap: 6px; height: 92px">
<span style="font-size: 13px; color: #62625F">③ 가게를 고르면</span>
<b style="font-size: 21px">정확한 위치와 길찾기</b>
<span style="font-size: 14px; line-height: 1.5; color: #3D3D3B">역에서 걷는 길, 주소 복사, 네이버 지도 앱으로 길찾기.</span>
</div>
</div>

<div style="display: grid; grid-template-columns: 390px 100px 390px 100px 390px; align-items: center">
<dc-import name="Main" palette="N1 쌀종이" hint-size="390px,844px"></dc-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #3D3D3B">
<svg width="56" height="24" viewBox="0 0 56 24" aria-hidden="true"><path d="M4 12h44M38 4l10 8-10 8" fill="none" stroke="#3D3D3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 13px; font-weight: 700">확대하면</span>
</div>
<dc-import name="ZoomStreet" palette="N1 쌀종이" edge="번짐" hint-size="390px,844px"></dc-import>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #3D3D3B">
<svg width="56" height="24" viewBox="0 0 56 24" aria-hidden="true"><path d="M4 12h44M38 4l10 8-10 8" fill="none" stroke="#3D3D3B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-size: 13px; font-weight: 700">카드 누르면</span>
</div>
<dc-import name="ZoomStore" palette="N1 쌀종이" hint-size="390px,844px"></dc-import>
</div>

<div style="display: grid; grid-template-columns: 6fr 2fr 5fr; height: 40px; border-radius: 8px; overflow: hidden; font-size: 13px; font-weight: 700">
<span style="display: flex; align-items: center; justify-content: center; background: #DADAD6; color: #1C1C1B">지도 확대 6~14 · 그림 지도</span>
<span style="display: flex; align-items: center; justify-content: center; background: #B9C9DD; color: #1C1C1B">15~16 · 겹쳐 넘어감</span>
<span style="display: flex; align-items: center; justify-content: center; background: #2D5B9A; color: #FFFFFF">17~21 · 실제 지도</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1450,"height":1140}}'>

  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
