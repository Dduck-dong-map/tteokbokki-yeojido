<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가게 위치와 길찾기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Song+Myung&amp;display=swap">
<style>
body{margin:0}
a{color:#2D5B9A}a:hover{color:#1E3A64}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{c.surface}}; font-family: 'Noto Sans KR', sans-serif; color: {{c.ink}}; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; box-sizing: border-box; background: {{c.bar}}; border-bottom: 1px solid {{c.line}}; flex-shrink: 0">
<a href="ZoomStreet.dc.html" aria-label="지도로 돌아가기" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<span style="font-size: 16px; font-weight: 700">가게 위치</span>
<button type="button" aria-label="공유하기" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 0">

<div style="display: flex; align-items: center; gap: 12px">
<span style="display: block; width: 44px; height: 44px; padding: 3px; box-sizing: border-box; border-radius: 4px; background: {{s3.bg}}; flex-shrink: 0; transform: rotate(-3deg)"><span style="display: flex; align-items: center; justify-content: center; height: 100%; border: 1.5px solid {{s3.edge}}; border-radius: 2px; color: {{s3.fg}}; font-family: 'Song Myung', serif; font-size: 22px">3</span></span>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-size: 21px; font-weight: 700">합정 쌀떡집</span><span style="padding: 1px 6px; border-radius: 4px; border: 1px solid {{c.chipLine}}; color: {{c.ink2}}; font-size: 11px; font-weight: 500">떡볶이 전문</span></div>
<span style="font-size: 13px; color: {{c.ink3}}">마포구 합정동 · 350m · 오늘 21:00까지</span>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
<b style="font-size: 16px">위치</b>
<a href="ZoomStreet.dc.html" style="font-size: 13px; font-weight: 700; color: {{c.accent}}; text-decoration: none">지도 크게 보기</a>
</div>

<div style="position: relative; width: 358px; height: 236px; overflow: hidden; border-radius: 14px; border: 1px solid {{c.line}}; background: {{c.mapBg}}">
<img src="{{c.street}}" alt="실제 지도 자리, 네이버 지도 API가 들어간다. 모양은 예시" style="position: absolute; left: -105px; top: -806px; width: 780px; height: 1688px">
<svg width="358" height="236" viewBox="0 0 358 236" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="M291 18 L262 60 L214 92 L182 112" fill="none" stroke="{{c.accent}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 7"></path></svg>
<div style="position: absolute; left: 266px; top: 4px; display: flex; align-items: center; gap: 4px">
<span style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: {{c.ink2}}; color: {{c.surface}}; font-size: 10px; font-weight: 700">역</span>
<span style="font-size: 12px; font-weight: 700; color: {{c.ink}}; text-shadow: 0 0 2px {{c.surface}}, 0 0 3px {{c.surface}}">합정역</span>
</div>
<div style="position: absolute; left: 160px; top: 96px; display: flex; align-items: center; gap: 6px">
<span style="display: block; width: 36px; height: 36px; padding: 2px; box-sizing: border-box; border-radius: 4px; background: {{s3.bg}}; box-shadow: 0 0 0 3px {{c.surface}}, 0 0 0 5px {{c.selRing}}; transform: rotate(-3deg)"><span style="display: flex; align-items: center; justify-content: center; height: 100%; border: 1.5px solid {{s3.edge}}; border-radius: 2px; color: {{s3.fg}}; font-family: 'Song Myung', serif; font-size: 19px">3</span></span>
<span style="padding: 2px 7px; border-radius: 4px; background: {{c.nameBg}}; color: {{c.nameText}}; font-size: 12px; font-weight: 700">합정 쌀떡집</span>
</div>
<span style="position: absolute; left: 8px; bottom: 8px; padding: 2px 6px; border-radius: 3px; background: {{c.attrBg}}; border: 1px dashed {{c.ink3}}; font-size: 10px; color: {{c.ink2}}">네이버 로고·저작권 자리</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="flex-grow: 1; font-size: 14px">[예시 주소] 서울 마포구 합정동</span>
<button type="button" style="height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid {{c.chipLine}}; background: {{c.surface}}; color: {{c.ink2}}; font: inherit; font-size: 12px; cursor: pointer">주소 복사</button>
</div>
<span style="padding-left: 26px; font-size: 13px; color: {{c.ink3}}">합정역에서 걸어서 3분 · [거리]</span>
</div>

<div style="display: flex; gap: 8px">
<a href="#" style="flex: 2 1 0; display: flex; align-items: center; justify-content: center; gap: 6px; height: 52px; border-radius: 12px; background: {{c.primary}}; color: {{c.onPrimary}}; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.onPrimary}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg>네이버 지도로 길찾기</a>
<a href="#" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 12px; border: 1px solid {{c.chipLine}}; background: {{c.surface}}; color: {{c.ink}}; font-size: 14px; font-weight: 700; text-decoration: none">카카오맵</a>
</div>
<span style="margin-top: -6px; font-size: 12px; color: {{c.ink3}}">길찾기를 누르면 네이버 지도 앱이 열려요. 앱이 없으면 웹으로 열려요.</span>

<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid {{c.line}}; font-size: 14px">
<b style="font-size: 16px">가게 정보</b>
<div style="display: flex; gap: 16px"><span style="width: 64px; color: {{c.ink3}}">영업시간</span><span>매일 11:00–21:00 · 월요일 쉼</span></div>
<div style="display: flex; gap: 16px"><span style="width: 64px; color: {{c.ink3}}">이용</span><span>혼밥 가능 · 포장 · 카드 가능</span></div>
<div style="display: flex; gap: 16px"><span style="width: 64px; color: {{c.ink3}}">같이 먹기</span><span>순대 · 튀김 · 어묵</span></div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["N1 쌀종이","N2 먹 회색","N3 쪽빛 종이","N4 옥빛","N5 순백","N6 먹밤","A 먹과 쪽빛","B 청자","C 노포","D 흰 떡","E 밤 포장마차","V1 기준"],"default":"N1 쌀종이"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  palettes() {
    const lightS3 = { bg: '#C8102E', fg: '#FFF4E6', edge: 'rgba(255, 244, 230, 0.75)' };
    const nightS3 = { bg: '#C92A30', fg: '#FFF4E6', edge: 'rgba(255, 244, 230, 0.85)' };
    const v1S3 = { bg: '#C00000', fg: '#F6EFE3', edge: 'rgba(246, 239, 227, 0.75)' };
    const make = (k, dark, s3) => {
      const [street, mapBg, bar, line, surface, chipLine, ink, ink2, ink3, primary, onPrimary, accent] = k;
      return { street, mapBg, bar, line, surface, chipLine, ink, ink2, ink3, primary, onPrimary, accent, nameBg: ink, nameText: dark ? bar : surface, selRing: dark ? ink : primary, attrBg: dark ? 'rgba(20, 21, 22, 0.85)' : 'rgba(255, 255, 255, 0.88)', s3: s3 || (dark ? nightS3 : lightS3) };
    };
    return {
      N1: make(['/_blob/95e0a1eb4bc1109658e2abacc43b5507', '#F2F2EF', '#FAFAF8', '#DEDED9', '#FFFFFF', '#D3D3CE', '#1C1C1B', '#3D3D3B', '#62625F', '#232323', '#FFFFFF', '#2D5B9A']),
      N2: make(['/_blob/12048e74c3be6a865033914a2daabd52', '#E6E6E4', '#F4F4F2', '#D2D2CE', '#FCFCFB', '#C6C6C1', '#161616', '#383836', '#5B5B58', '#161616', '#FFFFFF', '#161616']),
      N3: make(['/_blob/65a2d26e40c0e3c70bf7fd57376b5d90', '#E7EBEF', '#F5F7F9', '#D3DAE1', '#FBFCFD', '#C3CCD6', '#141B23', '#34404C', '#566270', '#1F3A5F', '#FFFFFF', '#2D5B9A']),
      N4: make(['/_blob/89e2ec2f22e6f1c0b763872f4d0c96fc', '#E5ECE8', '#F4F7F5', '#CFD9D3', '#FBFCFB', '#C0CCC5', '#14201B', '#33433B', '#54655C', '#24574F', '#FFFFFF', '#2B6259']),
      N5: make(['/_blob/205f0a3b224f4d7139e275568334d02c', '#F7F7F7', '#FFFFFF', '#E4E4E4', '#FFFFFF', '#DADADA', '#111111', '#333333', '#666666', '#111111', '#FFFFFF', '#2D5B9A']),
      N6: make(['/_blob/d0c6f2da5d35a5a7852fb384c85ff40d', '#1C1D1F', '#141516', '#34373A', '#242628', '#44484C', '#EDEDED', '#C9C9C9', '#9C9C9C', '#EDEDED', '#141516', '#8FB4E0'], true),
      A: make(['/_blob/dbd3647068002ef2dbe01594fa1a0b03', '#ECE3D1', '#F4EDE0', '#D5C6AE', '#FBF7EF', '#CDBDA3', '#1F1A17', '#3B3029', '#5C5046', '#2A2421', '#F6EFE3', '#2D5B9A']),
      B: make(['/_blob/62c87784f2dd44f342caccfca3c9039d', '#E8E6D8', '#F1F0E7', '#CDD3C6', '#FAFAF5', '#B9C4BC', '#18211E', '#313D38', '#52605A', '#2F6B62', '#F3F8F5', '#2B6259']),
      C: make(['/_blob/3a4e70049924560fe5be3db20301b5da', '#F0E3C8', '#F4E9D4', '#D9C4A1', '#FDF7EB', '#D2BB95', '#2A1D14', '#46331F', '#6A5440', '#5A3A22', '#FBF3E4', '#7A4A16']),
      D: make(['/_blob/39780c144bfb5a7db19886b9703e91a4', '#F4F2EC', '#FFFFFF', '#E5E1D9', '#FFFFFF', '#DAD5CC', '#151515', '#383838', '#666666', '#151515', '#FFFFFF', '#151515']),
      E: make(['/_blob/221293acb9fbf4d2f2ecfe3a09202d4a', '#1A2231', '#121925', '#2C384D', '#1D2637', '#3A465C', '#F3ECDF', '#D3CAB9', '#A69E8F', '#F0A23A', '#1A1206', '#F5B862'], true),
      V1: make(['/_blob/dbd3647068002ef2dbe01594fa1a0b03', '#ECE3D1', '#F4EDE0', '#D5C6AE', '#FBF7EF', '#CDBDA3', '#1A1614', '#3B3029', '#5C5046', '#C00000', '#F6EFE3', '#C00000'], false, v1S3)
    };
  }
  renderVals() {
    const all = this.palettes();
    const key = String(this.props.palette ?? 'N1 쌀종이').split(' ')[0];
    const c = all[key] || all.N1;
    return { c, s3: c.s3 };
  }
}
</script>
</body>
</html>
