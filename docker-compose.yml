# 떡볶여지도 로컬 DB (11-08) — PostgreSQL 16 + PostGIS 3.4 (Supabase 와 같은 종류).
# 처음 뜰 때 db/init/*.sql 로 표를 만든다. 비밀번호는 이 컴퓨터 안에서만 쓰는 시험용이다.
#   켜기 npm run db:up · 끄기 npm run db:down · 처음부터 다시 npm run db:reset · 표 보기 npm run db:psql
# 앱이 이 DB 를 쓰게 하려면 .env.local 에 DATABASE_URL (.env.example 참고) → 개발 서버 다시 켜기.
name: tteokbokki

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tteokbokki-db
    environment:
      POSTGRES_USER: ddy
      POSTGRES_PASSWORD: ddy_local
      POSTGRES_DB: tteok
      TZ: Asia/Seoul
    ports:
      # 이 컴퓨터에서만 열린다. 15432 = 윈도우가 잡아 두는 포트 범위(49152 위)를 피한 값 (11-09: 54322 가 막혀서 바꿈)
      - "127.0.0.1:${DDY_DB_PORT:-15432}:5432"
    volumes:
      - ddy-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddy -d tteok"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  ddy-db:
