# 떡볶여지도 로컬 DB (11-08) — PostgreSQL 16 + PostGIS 3.4 (Supabase 와 같은 종류).
# 처음 뜰 때 db/init/*.sql 로 표를 만든다. 비밀번호는 이 컴퓨터 안에서만 쓰는 시험용이다.
#   켜기 npm run db:up · 끄기 npm run db:down · 처음부터 다시 npm run db:reset · 표 보기 npm run db:psql
# 앱이 이 DB 를 쓰게 하려면 .env.local 에 DATABASE_URL (.env.example 참고) → 개발 서버 다시 켜기.
name: tteokbokki

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tteokbokki-db
    environment:
      POSTGRES_USER: ddy
      POSTGRES_PASSWORD: ddy_local
      POSTGRES_DB: tteok
      TZ: Asia/Seoul
    ports:
      # 이 컴퓨터에서만 열린다. 15432 = 윈도우가 잡아 두는 포트 범위(49152 위)를 피한 값 (11-09: 54322 가 막혀서 바꿈)
      - "127.0.0.1:${DDY_DB_PORT:-15432}:5432"
    volumes:
      - ddy-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddy -d tteok"]
      interval: 3s
      timeout: 3s
      retries: 30

  # 앱 서버 (11-11) — 배포처럼 빌드한 앱을 도커로 띄운다. 켜기 pnpm app:up · 끄기 pnpm app:down · 기록 pnpm app:logs
  # 개발 서버(pnpm dev)와 같은 DB(tteok)를 쓰고, 같은 포트(3000)라 둘 중 하나만 켠다. db/README.md 「앱 서버」
  app:
    build:
      context: .
      args:
        # pnpm app:up 은 .env.local 의 값을 넘긴다 (--env-file .env.local). 바꾸면 다시 빌드된다.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_NAVER_MAP_KEY_ID: ${NEXT_PUBLIC_NAVER_MAP_KEY_ID:-}
        NEXT_PUBLIC_SAMPLE_DATA: ${NEXT_PUBLIC_SAMPLE_DATA:-}
    image: tteokbokki-app
    container_name: tteokbokki-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 컨테이너끼리는 이름(db)과 안쪽 포트(5432)로 붙는다. 시험할 땐 DDY_APP_DB 로 다른 DB 를 고른다
      DATABASE_URL: postgres://ddy:ddy_local@db:5432/${DDY_APP_DB:-tteok}
      # 비우면 개발 서버와 같은 기본값 → 같은 DB 에서 같은 사람으로 셈. 이 서버를 밖에 열 땐 긴 글자를 넣는다
      HASH_SALT: ${HASH_SALT:-}
      TZ: Asia/Seoul
    ports:
      # 이 컴퓨터에서만 열린다. 같은 와이파이의 폰으로 볼 땐 DDY_APP_HOST=0.0.0.0
      - "${DDY_APP_HOST:-127.0.0.1}:${DDY_APP_PORT:-3000}:3000"
    volumes:
      # 사진은 개발 서버와 같은 폴더(.data/photos)에 둔다 (DB 에는 사진 id 만 있으므로)
      - ./.data/photos:/data/photos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  ddy-db:
